name: Platform Docker diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-smoke:
    name: docker diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun
      - name: Diagnose Docker lifecycle
        run: bun scripts/ci/docker-smoke.ts
